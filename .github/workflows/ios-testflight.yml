name: iOS TestFlight (Local Build)

on:
  workflow_dispatch:
  push:
    branches:
      - release/ios

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g expo-cli eas-cli

      - name: Authenticate Expo
        run: expo whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Create Apple API key
        run: |
          mkdir -p ~/.app-store-connect
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/.app-store-connect/AuthKey.p8

      - name: Run iOS local build
        run: |
          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_API_KEY_PATH: ~/.app-store-connect/AuthKey.p8
          EXPO_APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_APPLE_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: Submit to TestFlight
        run: |
          eas submit -p ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}